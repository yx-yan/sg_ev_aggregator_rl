[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sg-ev-rl"
version = "0.1.0"
description = "EV aggregator scheduling for grid services in Singapore: simulator, RL agents and optimisation baselines"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "gymnasium>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# frozen dataclasses are safe as argument defaults
extend-immutable-calls = ["sg_ev_rl.market.v2g_roughcalc.Battery", "sg_ev_rl.scenarios.public_charging.VehicleAssumptions",
                         "sg_ev_rl.sim.fleet_env.EnvConfig",
                         "sg_ev_rl.scheduling.service_lp.ServiceConfig"]
